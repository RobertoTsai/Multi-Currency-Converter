<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Currency Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/7.2.3/css/flag-icons.min.css" integrity="sha512-bZBu2H0+FGFz/stDN/L0k8J0G8qVsAL0ht1qg5kTwtAheiXwiRKyCq1frwfbSFSJN3jooR5kauE0YjtPzhZtJQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <div class="header-content">
            <img src="images/icon128.png" alt="Multi-Currency Converter Icon" class="header-icon">
            <h1>Multi-Currency Converter</h1>
        </div>
        <div class="header-actions">
            <button id="open-settings" title="Settings" data-i18n-title="settings"><i class="fas fa-cog"></i></button>
            <button id="popup-window" title="Popup window" data-i18n-title="popupWindow"><i class="fas fa-external-link-alt"></i></button>
        </div>
    </div>
    <div id="main-view">
        <div class="content-wrapper">
            <ul id="currency-list"></ul>
        </div>
        <button id="add-currency">+</button>
    </div>
    <div id="settings-view" style="display: none;">
        <div class="settings-header">
            <button id="back-button" title="Back" data-i18n-title="back"><i class="fas fa-arrow-left"></i></button>
            <h2 data-i18n="settings">Settings</h2>
        </div>
        <div class="settings-content">
            <div class="settings-group">
                <label data-i18n="decimalSeparatorLabel">Decimal Separator</label>
                <div class="segmented-control" id="decimal-separator-toggle">
                    <button class="segmented-item" data-value=".">
                        <span class="symbol-large">.</span>
                        <span class="symbol-name" data-i18n="dotLabel">Dot</span>
                    </button>
                    <button class="segmented-item" data-value=",">
                        <span class="symbol-large">,</span>
                        <span class="symbol-name" data-i18n="commaLabel">Comma</span>
                    </button>
                </div>
            </div>
            <div class="settings-group">
                <label data-i18n="thousandsSeparatorLabel">Thousands Separator</label>
                <div class="segmented-control" id="thousands-separator-toggle">
                    <button class="segmented-item" data-value=",">
                        <span class="symbol-large">,</span>
                        <span class="symbol-name" data-i18n="commaLabel">Comma</span>
                    </button>
                    <button class="segmented-item" data-value=".">
                        <span class="symbol-large">.</span>
                        <span class="symbol-name" data-i18n="dotLabel">Dot</span>
                    </button>
                    <button class="segmented-item" data-value=" ">
                        <span class="symbol-large">␣</span>
                        <span class="symbol-name" data-i18n="space">Space</span>
                    </button>
                    <button class="segmented-item" data-value="">
                        <span class="symbol-large">∅</span>
                        <span class="symbol-name" data-i18n="none">None</span>
                    </button>
                </div>
            </div>
            <div class="preview-group">
                <span class="preview-label" data-i18n="previewLabel">Format Preview:</span>
                <span id="format-preview">12,345.67</span>
            </div>
            <hr class="settings-divider">
            <div class="settings-group">
                <label for="decimal-places-select" data-i18n="decimalPlacesLabel">Decimal Places</label>
                <select id="decimal-places-select">
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                </select>
            </div>
            <div class="settings-group">
                <label for="language-select" data-i18n="languageLabel">Language</label>
                <select id="language-select">
                    <option value="en">English</option>
                    <option value="zh-TW">繁體中文</option>
                    <option value="zh-CN">簡體中文</option>
                </select>
            </div>
        </div>
    </div>
    <div id="currency-modal">
        <div class="modal-content">
            <button id="close-modal" type="button" aria-label="Close">&times;</button>
            <div class="search-container">
                <input type="text" id="currency-search" placeholder="Search currency..." data-i18n-placeholder="searchPlaceholder">
                <button id="clear-search" aria-label="Clear search">&times;</button>
            </div>
            <ul id="all-currencies"></ul>
            <div id="no-results" class="no-results" style="display: none;" data-i18n="noResults">No matching results</div>
        </div>
    </div>
    
    <div id="confirm-dialog" class="confirm-modal">
        <div class="confirm-dialog-content">
            <h3 id="confirm-title" data-i18n="confirmDelete">確認刪除</h3>
            <p id="confirm-message"></p>
            <div class="dialog-buttons">
                <button id="cancel-button" class="secondary-button" data-i18n="cancel">取消</button>
                <button id="confirm-button" class="primary-button" data-i18n="confirm">確認</button>
            </div>
        </div>
    </div>
    
    <script src="Sortable.min.js"></script>
    <script src="popup.js"></script>
</body>
</html>
